name: CI
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dependency-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Scan the npm lockfile
        shell: bash
        run: npm audit --package-lock-only --include=dev --audit-level=high --json | tee npm-audit.json
      - name: Upload the dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      # Keep the image version aligned with @playwright/test in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Provision virtual audio output for browser tests
        shell: bash
        timeout-minutes: 2
        run: |
          if ! command -v pulseaudio >/dev/null || ! command -v pactl >/dev/null; then
            apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y --no-install-recommends pulseaudio pulseaudio-utils
          fi
          pulse_runtime="$(mktemp -d)"
          chown pwuser:pwuser "$pulse_runtime"
          runuser -u pwuser -- env XDG_RUNTIME_DIR="$pulse_runtime" pulseaudio --start --exit-idle-time=-1
          runuser -u pwuser -- env XDG_RUNTIME_DIR="$pulse_runtime" pactl load-module module-null-sink sink_name=playwright
          export PULSE_SERVER="unix:$pulse_runtime/pulse/native"
          export PULSE_COOKIE=/home/pwuser/.config/pulse/cookie
          pactl list short sinks
          {
            echo "PULSE_SERVER=$PULSE_SERVER"
            echo "PULSE_COOKIE=$PULSE_COOKIE"
            echo "PULSE_SINK=playwright"
          } >> "$GITHUB_ENV"
      - run: npm run test:e2e
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
